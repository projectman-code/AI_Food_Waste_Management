{% extends "base.html" %}{% block title %}Edit food listing | FreshLoop{% endblock %}{% block content %}
<div class="form-wrap"><div class="form-card wide"><span class="eyebrow">SURPLUS FOOD</span><h1>Edit food listing</h1><form method="post">
<label>Food name<input name="food_name" required value="{{ donation.food_name }}"></label>
<div class="two-col"><label>Category<select name="category">{% for option in ['Cooked meal','Fruit','Vegetable','Dairy','Bakery','Packaged','Other'] %}<option value="{{ option }}" {% if donation.category == option %}selected{% endif %}>{{ option }}</option>{% endfor %}</select></label><label>Quantity (kg)<input type="number" name="quantity_kg" min="0.1" step="0.1" required value="{{ donation.quantity_kg }}"></label></div>
<div class="two-col"><label>Expiry / best-before date<input type="date" name="expiry_date" value="{{ donation.expiry_date or '' }}"></label><label>Pickup location<input name="location" value="{{ donation.location or '' }}"></label></div>
<label>Description<textarea name="description" rows="3">{{ donation.description or '' }}</textarea></label>
{% if logged_in_user.role == 'Admin' %}<label>Listing status<select name="status"><option value="Available" {% if donation.status == 'Available' %}selected{% endif %}>Available</option><option value="Claimed" {% if donation.status == 'Claimed' %}selected{% endif %}>Claimed</option></select></label>{% endif %}
<button class="btn primary full" type="submit">Save changes</button><a class="btn full" href="{{ url_for('dashboard') }}">Cancel</a></form></div></div>
{% endblock %}
