{% extends "base.html" %}{% block title %}Add food | FreshLoop{% endblock %}{% block content %}
<div class="form-wrap"><div class="form-card wide"><span class="eyebrow">SURPLUS FOOD</span><h1>Create a listing</h1><form method="post">
<label>Food name<input name="food_name" required placeholder="e.g. Vegetable rice"></label>
<div class="two-col"><label>Category<select name="category"><option>Cooked meal</option><option>Fruit</option><option>Vegetable</option><option>Dairy</option><option>Bakery</option><option>Packaged</option><option>Other</option></select></label><label>Quantity (kg)<input type="number" name="quantity_kg" min="0.1" step="0.1" required></label></div>
<div class="two-col"><label>Expiry / best-before date<input type="date" name="expiry_date"></label><label>Pickup location<input name="location" placeholder="Area / address"></label></div>
<label>Description<textarea name="description" rows="3" placeholder="Preparation time, storage details, pickup instructions..."></textarea></label>
<button class="btn primary full">Publish listing</button></form></div></div>
{% endblock %}
